name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CCAutoApprove.sln
      - run: dotnet build CCAutoApprove.sln -c Release --no-restore
      - run: dotnet test CCAutoApprove.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" -m:1 -- xUnit.ParallelizeTestCollections=false
      - shell: pwsh
        run: ./scripts/publish.ps1 -Version 0.1.0-ci
      - shell: pwsh
        run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.1.0 installer/CCAutoApprove.iss'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CCAutoApprove-Windows-Installer-${{ github.sha }}
          path: artifacts/installer/CCAutoApprove-Setup-0.1.0.exe
          if-no-files-found: error
          retention-days: 14
